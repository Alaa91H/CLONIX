plugins {
    id 'com.android.application'
}

android {
    namespace 'com.clonix.app'
    // compileSdk only (targetSdk stays 34: no new runtime behavior).
    compileSdk 35

    defaultConfig {
        applicationId 'com.clonix.app'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    // Stable signing identity: every build type signs with the SAME key so
    // updates always install over the previous install (no uninstall).
    // Priority: CI env secrets (KEYSTORE_BASE64 + KEYSTORE_PASSWORD +
    // KEY_ALIAS + KEY_PASSWORD) -> local keystore.properties (gitignored)
    // -> maintainer keystore. On a fresh fork with no secrets and no
    // keystore, release falls back to the debug key so CI still produces
    // an installable APK.
    def ksProps = new Properties()
    def ksFile = rootProject.file('keystore.properties')
    def hasKs = ksFile.exists()
    if (hasKs) ksProps.load(new FileInputStream(ksFile))
    def envB64 = System.getenv('KEYSTORE_BASE64')
    def envStore = System.getenv('KEYSTORE_PASSWORD')
    def ci = envB64 != null && !envB64.isEmpty() && envStore != null && !envStore.isEmpty()
    def maintainerKs = rootProject.file('../keystore/clonix-release.jks').exists()
    signingConfigs {
        release {
            if (ci) {
                def ksPath = rootProject.file('clonix-release.jks')
                if (!ksPath.exists()) ksPath.text = new String(envB64.decodeBase64())
                storeFile ksPath
                storePassword envStore
                keyAlias System.getenv('KEY_ALIAS') ?: 'clonix'
                keyPassword System.getenv('KEY_PASSWORD') ?: envStore
            } else if (hasKs) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            } else if (maintainerKs) {
                storeFile rootProject.file('../keystore/clonix-release.jks')
                storePassword 'clonix-sign-2026'
                keyAlias 'clonix'
                keyPassword 'clonix-sign-2026'
            }
        }
        debug {
            def projKs = rootProject.file('../keystore/clonix-release.jks')
            if (projKs.exists()) {
                // Same stable key as release: local debug installs also update in place.
                storeFile projKs
                storePassword 'clonix-sign-2026'
                keyAlias 'clonix'
                keyPassword 'clonix-sign-2026'
            }
            // else: default ~/.android/debug.keystore (fresh forks/CI without secrets)
        }
    }

    // Single source of truth: reuse the AOSP/ROM layout (no duplication).
    sourceSets {
        main {
            manifest.srcFile '../../AndroidManifest.xml'
            java.srcDirs = ['../../src']
            res.srcDirs = ['../../res']
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
