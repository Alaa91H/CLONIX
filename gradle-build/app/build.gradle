plugins {
    id 'com.android.application'
}

android {
    namespace 'com.clonepilot.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.clonepilot.app'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    // Single source of truth: reuse the AOSP/ROM layout (no duplication).
    sourceSets {
        main {
            manifest.srcFile '../../AndroidManifest.xml'
            java.srcDirs = ['../../src']
            res.srcDirs = ['../../res']
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
