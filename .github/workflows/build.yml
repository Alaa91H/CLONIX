name: Build CLONIX APK

# Builds the APK on every push (no local SDK needed) and attaches it as an
# artifact. When the signing secrets are configured (repo Settings > Secrets
# and variables > Actions, see SECRETS_SETUP.md), the artifact is signed with
# the stable release key — installs update in place, no uninstall/reinstall.
# Without secrets it still builds an installable debug-signed APK.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gradle-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode signing keystore from secrets
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > clonix-release.jks

      - name: Build signed release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Build debug APK (fallback when no secrets)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          SRC=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null || ls app/build/outputs/apk/debug/*.apk)
          cp "$SRC" Clonix.apk
          ls -la Clonix.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clonix-apk
          path: gradle-build/Clonix.apk
