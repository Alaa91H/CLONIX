name: Build DualMessenger APK

# Push this folder as a GitHub repo root, Actions builds the APK for you.
# No local SDK, no WSL, no ROM tree needed.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gradle-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename + upload
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DualMessenger.apk
          ls -la DualMessenger.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualMessenger-apk
          path: gradle-build/DualMessenger.apk
