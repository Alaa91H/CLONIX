name: Bug report
description: Report a reproducible problem in CLONIX
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CLONIX. Please provide enough detail to reproduce the problem.
        For security vulnerabilities, do not use this form; follow SECURITY.md instead.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened?
      placeholder: Describe the problem clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the version/commit and relevant OS, Android version, device, ROM, browser, or runtime information.
      placeholder: |
        Version/commit:
        Platform:
        Device/runtime:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add relevant logs or screenshots. Remove tokens, credentials, phone numbers, and other private data.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets and personal data from logs and screenshots.
          required: true
